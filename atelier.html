<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F8F3E9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atelier">
<title>Atelier Trompette</title>
<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.5/build/cjs/vexflow-bravura.js"></script>
<style>
:root{
  --bg:#F8F3E9; --paper:#FFFDF8; --ink:#1E1912; --muted:#6F665A; --line:#E7DDCB; --line2:#D8CBB2;
  --brass:#C98A12; --brass-d:#8A5C06; --brass-l:#FBEFD2;
  --ok:#1E8E50; --ok-l:#DDF2E5; --bad:#C93838; --bad-l:#F8DDDA;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.35}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.app{max-width:1180px;margin:0 auto;padding:10px 16px 40px}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:13.5px}
header{display:flex;align-items:center;gap:12px;padding:6px 0 12px}
header h1{font-size:22px;margin:0;flex:1}
header .sub{font-size:14px;color:var(--muted);font-weight:600}
.tabs{display:flex;gap:6px;background:#EFE6D6;border-radius:14px;padding:4px;margin-bottom:12px;max-width:520px}
.tabs button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:11px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}
.card h3{margin:0 0 8px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 12px}
.fld label{display:block;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.fld select,.fld input[type=number]{width:100%;padding:9px 10px;border-radius:11px;border:1.5px solid var(--line2);background:#fff;font-weight:600}
.fld .tempo{display:flex;align-items:center;gap:8px}
.fld .tempo input[type=range]{flex:1;accent-color:var(--brass);min-width:0}
.fld .tempo b{min-width:38px;text-align:right;font-size:18px}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;padding-top:20px}
.chk input{width:20px;height:20px;accent-color:var(--brass)}
.info{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 2px 8px}
.tag{background:var(--brass-l);color:var(--brass-d);border-radius:99px;padding:5px 12px;font-weight:800;font-size:14px}
.tag.plain{background:#EFE6D6;color:var(--ink)}
#vp{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 8px 20px -14px rgba(30,25,18,.35)}
#vp.review{overflow-x:auto;-webkit-overflow-scrolling:touch}
#strip{position:relative}
#strip svg{display:block}
.chunk{position:absolute;left:0;top:0;will-change:transform}
#strip.flow{display:flex;height:auto!important}
#strip.flow .chunk{position:static;display:block!important;transform:none!important;flex:none}
#ph{position:absolute;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--brass);opacity:.85;pointer-events:none}
#mask{position:absolute;top:0;bottom:0;left:0;background:var(--paper);opacity:.93;pointer-events:none;border-right:1px solid var(--line)}
#count{position:absolute;inset:0;display:grid;place-items:center;font-size:92px;font-weight:900;color:var(--brass);pointer-events:none;text-shadow:0 2px 0 #fff}
.transport{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0 4px}
.btn{appearance:none;border:0;border-radius:14px;padding:13px 20px;font-weight:800;font-size:16px;background:var(--ink);color:#fff}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brass)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line2)}
.btn.stop{background:var(--bad)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.45}
.status{flex:1;min-width:180px;text-align:right;font-weight:700;color:var(--muted)}
.status b{color:var(--ink)}
.meter{height:6px;background:#ECE1CE;border-radius:9px;overflow:hidden;width:120px;display:inline-block;vertical-align:middle;margin-left:8px}
.meter i{display:block;height:100%;background:var(--ok);transform-origin:left;transform:scaleX(0)}
.res-big{font-size:44px;font-weight:900;line-height:1}
.stars button{font-size:30px;background:none;border:0;padding:2px 4px;filter:grayscale(1);opacity:.45}
.stars button.on{filter:none;opacity:1}
.warn{background:var(--brass-l);color:var(--brass-d);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14.5px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
#vp{min-height:190px}
#memo{position:absolute;inset:0;background:var(--paper);display:grid;place-items:center;text-align:center;padding:16px}
#memo .big{font-size:34px;font-weight:900}
#memo .sub{font-size:17px;color:var(--muted);font-weight:700;margin-top:6px}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin:4px 2px 10px}
.keys span{min-width:52px;text-align:center;border-radius:11px;padding:6px 8px;font-weight:800;font-size:14px;background:#EFE6D6;color:var(--muted);border:2px solid transparent}
.keys span.cur{border-color:var(--brass);color:var(--ink);background:var(--paper)}
.keys span.ok{background:var(--ok-l);color:#115B32}
.keys span.ko{background:var(--bad-l);color:#8E1F1F}
.slots{display:flex;gap:7px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.slots i{width:22px;height:22px;border-radius:50%;border:2px dashed var(--line2)}
.slots i.ok{border:0;background:var(--ok)}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🎺 Atelier Trompette</h1>
  </header>

  <div id="loadErr" class="warn hidden">La bibliothèque de gravure musicale n'a pas pu se charger. Vérifie la connexion internet, puis recharge la page.</div>

  <div class="tabs" id="tabs"><button data-t="sight">Déchiffrage défilant</button><button data-t="jazz">Jazz</button></div>

  <div id="pSight" class="card">
    <div class="grid">
      <div class="fld"><label for="fStyle">Style</label><select id="fStyle">
        <optgroup label="Lecture"><option value="c">Classique</option><option value="m">Marche / harmonie</option><option value="s">Swing</option><option value="l">Latin</option><option value="f">Funk</option></optgroup><optgroup label="Jazz sur grille d'accords"><option value="bl">Blues (12 mesures)</option><option value="st">Standard swing (AABA)</option><option value="bb">Bebop</option><option value="ba">Ballade</option><option value="bo">Bossa nova</option><option value="jw">Valse jazz</option><option value="mo">Modal</option></optgroup></select></div>
      <div class="fld"><label for="fLevel">Niveau</label><select id="fLevel"></select></div>
      <div class="fld"><label for="fMeter">Mesure</label><select id="fMeter">
        <option value="auto">Auto</option><option>4/4</option><option>3/4</option><option>2/4</option><option>6/8</option></select></div>
      <div class="fld"><label for="fKey">Armure</label><select id="fKey"></select></div>
      <div class="fld"><label for="fBars">Longueur</label><select id="fBars">
        <option value="8">8 mesures</option><option value="12">12 mesures</option><option value="16">16 mesures</option><option value="24">24 mesures</option><option value="32">32 mesures</option><option value="m2">Morceau d'environ 2 min</option><option value="m3">Morceau d'environ 3 min</option></select></div>
      <div class="fld"><label for="fTempo">Tempo <span id="tempoUnit"></span></label><div class="tempo"><input type="range" id="fTempo" min="40" max="200" step="2"><b id="tempoVal"></b></div></div>
      <div class="fld"><label for="fLook">Regard</label><select id="fLook">
        <option value="0">Tout visible</option><option value="1">Masquer les notes passées</option><option value="2">Masquer jusqu'à 1 temps devant</option></select></div>
    </div>
  </div>

  <div id="pJazz" class="hidden">
    <div class="card">
      <div class="grid">
        <div class="fld"><label for="jType">Exercice</label><select id="jType">
          <option value="lick">Traits écrits</option><option value="scale">Gammes et modes</option><option value="arp">Arpèges</option><option value="ear">Écoute et joue</option></select></div>
        <div class="fld"><label for="jLevel">Niveau</label><select id="jLevel">
          <option value="1">1 · Débutant</option><option value="2">2 · Élémentaire</option><option value="3">3 · Intermédiaire</option><option value="4">4 · Avancé</option><option value="5">5 · Expert</option></select></div>
        <div class="fld" id="jItemF" style="grid-column:span 2"><label for="jItem">Choix</label><select id="jItem"></select></div>
        <div class="fld"><label for="jOrder">Tonalités</label><select id="jOrder">
          <option value="4ths">Cycle des quartes</option><option value="chrom">Chromatique montant</option><option value="rand">Ordre aléatoire</option><option value="single">Une seule tonalité</option></select></div>
        <div class="fld"><label for="jKey">Tonalité de départ</label><select id="jKey"></select></div>
        <div class="fld"><label for="jTempo">Tempo (noire)</label><div class="tempo"><input type="range" id="jTempo" min="50" max="240" step="2"><b id="jTempoVal"></b></div></div>
        <div class="fld" id="jShowF"><label for="jShow">Partition</label><select id="jShow">
          <option value="0">Toujours visible</option><option value="1">Visible à la 1re tonalité seulement</option><option value="2">Cachée (écouter, puis jouer)</option></select></div>
        <div class="fld hidden" id="jHelpF"><label for="jHelp">Aide</label><select id="jHelp">
          <option value="1">Gamme + première note</option><option value="0">Gamme seulement</option></select></div>
        <label class="chk"><input type="checkbox" id="jSwing"><span>Croches swing</span></label>
        <label class="chk"><input type="checkbox" id="jAuto"><span>Enchaîner tout seul</span></label>
      </div>
    </div>
    <div class="keys" id="jKeys"></div>
  </div>

  <div class="info" id="info"></div>
  <div id="vp"><div id="strip"></div><div id="mask" class="hidden"></div><div id="ph" class="hidden"></div><div id="memo" class="hidden"></div><div id="count" class="hidden"></div></div>

  <div class="transport" id="tSight">
    <button class="btn primary" id="bStart">▶︎ Départ</button>
    <button class="btn ghost" id="bNew">Nouveau morceau</button>
    <button class="btn ghost" id="bHear">🔊 Écouter</button>
    <div class="status" id="status"></div>
  </div>
  <div class="transport hidden" id="tJazz">
    <button class="btn primary" id="jStart">▶︎ Départ</button>
    <button class="btn ghost" id="jHear">🔊 Écouter</button>
    <button class="btn ghost" id="jNext">Tonalité suivante →</button>
    <div class="status" id="status2"></div>
  </div>
  <div id="micNote" class="warn hidden"></div>

  <div class="card hidden" id="result"></div>

  <div class="card" id="journalCard">
    <h3>Journal de travail</h3>
    <div id="journal" class="small muted">Aucune séance pour l'instant.</div>
  </div>
  <div class="card">
    <h3>Réglages communs</h3>
    <div class="grid">
      <div class="fld"><label for="fMic">Vérification</label><select id="fMic">
        <option value="1">Avec micro</option><option value="0">Sans micro (auto-évaluation)</option></select></div>
      <div class="fld"><label for="fInstr">Instrument</label><select id="fInstr"><option value="bb">Trompette en Si♭</option><option value="c">Instrument en Ut</option></select></div>
      <div class="fld"><label for="fLo">Note la plus grave</label><select id="fLo"></select></div>
      <div class="fld"><label for="fHi">Note la plus aiguë</label><select id="fHi"></select></div>
      <div class="fld"><label for="fSize">Taille de la partition</label><select id="fSize"><option value="1.25">Petite</option><option value="1.6">Moyenne</option><option value="2">Grande</option><option value="2.4">Très grande</option></select></div>
      <label class="chk"><input type="checkbox" id="fMetro"><span>Métronome</span></label>
    </div>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
/* ---------- stockage ---------- */
const KEY = 'atelierTrompette.v1';
const DEF = { style: 'c', level: 3, meter: 'auto', keyN: 'auto', bars: 16, tempo: {}, look: 0, mic: 1, metro: true, instr: 'bb', lo: 54, hi: 84, size: 1.6, journal: [], tab: 'sight', jz: { type: 'lick', level: 1, item: {}, order: '4ths', key: 0, tempo: {}, show: 0, help: 1, swing: true, auto: true, mast: {}, ear: {} } };
let S = Object.assign({}, DEF);
try { const r = localStorage.getItem(KEY); if (r) { const o = JSON.parse(r); S = Object.assign({}, DEF, o); S.jz = Object.assign({}, DEF.jz, o.jz || {}); } } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function transp() { return S.instr === 'bb' ? 2 : 0; }

/* ---------- capacités ---------- */
const IN_FRAME = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
function micPolicyOk() { try { const fp = document.permissionsPolicy || document.featurePolicy; if (fp && fp.allowsFeature) return fp.allowsFeature('microphone'); } catch (e) {} return !IN_FRAME; }
const CAN_MIC = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && window.isSecureContext && micPolicyOk();

/* ---------- audio (commun avec l'appli élève) ---------- */
let actx = null;
function ctx() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    try { actx = new AC({ latencyHint: 'interactive' }); } catch (e) { actx = new AC(); }
  }
  if (actx.state !== 'running') { try { actx.resume(); } catch (e) {} }
  return actx;
}
function setSession(t) { try { if (navigator.audioSession) navigator.audioSession.type = t; } catch (e) {} }
function click(dest, t, accent, vol) {
  const c = actx, o = c.createOscillator(), g = c.createGain();
  o.type = 'sine'; o.frequency.value = accent ? 1760 : 1175;
  const v = (accent ? 0.9 : 0.6) * (vol == null ? 1 : vol);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.001, v), t + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.08);
}
function tone(dest, t, dur, midi) {
  const c = actx, f = 440 * Math.pow(2, (midi - 69) / 12);
  const o1 = c.createOscillator(), o2 = c.createOscillator(), mix = c.createGain(), lp = c.createBiquadFilter(), g = c.createGain();
  o1.type = 'sawtooth'; o1.frequency.value = f;
  o2.type = 'square'; o2.frequency.value = f * 1.003;
  const m2 = c.createGain(); m2.gain.value = 0.25;
  o1.connect(mix); o2.connect(m2); m2.connect(mix);
  lp.type = 'lowpass'; lp.Q.value = 1.5;
  lp.frequency.setValueAtTime(450, t); lp.frequency.linearRampToValueAtTime(2600, t + 0.05); lp.frequency.linearRampToValueAtTime(1600, t + 0.18);
  const rel = Math.min(0.06, dur * 0.3);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.2, t + 0.025);
  g.gain.setValueAtTime(0.18, t + Math.max(0.03, dur - rel)); g.gain.linearRampToValueAtTime(0.0001, t + dur);
  mix.connect(lp); lp.connect(g); g.connect(dest);
  o1.start(t); o2.start(t); o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
}
// correspondance temps audio -> performance.now()
function audioPerfOffset() {
  const c = actx;
  try {
    if (c.getOutputTimestamp) {
      const ts = c.getOutputTimestamp();
      if (ts && ts.contextTime > 0 && ts.performanceTime > 0) return ts.performanceTime - ts.contextTime * 1000;
    }
  } catch (e) {}
  return performance.now() - c.currentTime * 1000 + ((c.outputLatency || c.baseLatency || 0) * 1000);
}
function evTime(e) { const t = e && e.timeStamp; const now = performance.now(); return (t && Math.abs(t - now) < 1000) ? t : now; }

// Micro
let mic = null;
async function openMic() {
  if (mic) return mic;
  setSession('play-and-record');
  const c = ctx();
  const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  const src = c.createMediaStreamSource(stream);
  const an = c.createAnalyser(); an.fftSize = 2048; an.smoothingTimeConstant = 0;
  src.connect(an);
  mic = { stream, src, an, buf: new Float32Array(an.fftSize), bytes: null };
  return mic;
}
function closeMic() {
  if (!mic) return;
  try { mic.stream.getTracks().forEach(t => t.stop()); mic.src.disconnect(); } catch (e) {}
  mic = null; setSession('playback');
}
function readMic() {
  const { an, buf } = mic;
  if (an.getFloatTimeDomainData) an.getFloatTimeDomainData(buf);
  else { if (!mic.bytes) mic.bytes = new Uint8Array(buf.length); an.getByteTimeDomainData(mic.bytes); for (let i = 0; i < buf.length; i++) buf[i] = (mic.bytes[i] - 128) / 128; }
  return buf;
}
// Détection de hauteur (YIN)
const YW = 1024; let yD = null, yC = null;
function yin(buf, sr) {
  const tauMin = Math.floor(sr / 1100), tauMax = Math.min(Math.floor(sr / 110), buf.length - YW - 1);
  if (!yD || yD.length < tauMax + 1) { yD = new Float32Array(tauMax + 1); yC = new Float32Array(tauMax + 1); }
  let e = 0; for (let i = 0; i < YW; i++) e += buf[i] * buf[i];
  const rms = Math.sqrt(e / YW);
  if (rms < 0.006) return { f: 0, rms };
  for (let tau = 1; tau <= tauMax; tau++) { let s = 0; for (let j = 0; j < YW; j++) { const x = buf[j] - buf[j + tau]; s += x * x; } yD[tau] = s; }
  let run = 0; yC[0] = 1;
  for (let tau = 1; tau <= tauMax; tau++) { run += yD[tau]; yC[tau] = run > 0 ? yD[tau] * tau / run : 1; }
  let tau = -1;
  for (let t = tauMin; t <= tauMax; t++) { if (yC[t] < 0.15) { while (t + 1 <= tauMax && yC[t + 1] < yC[t]) t++; tau = t; break; } }
  if (tau < 0) { let mi = tauMin; for (let t = tauMin; t <= tauMax; t++) if (yC[t] < yC[mi]) mi = t; if (yC[mi] < 0.3) tau = mi; else return { f: 0, rms }; }
  let bt = tau;
  if (tau > 1 && tau < tauMax) { const s0 = yC[tau - 1], s1 = yC[tau], s2 = yC[tau + 1]; const den = 2 * (2 * s1 - s2 - s0); if (den) bt = tau + (s2 - s0) / den; }
  return { f: sr / bt, rms, conf: 1 - yC[tau] };
}



/* ---------- théorie ---------- */
const LET = ['c', 'd', 'e', 'f', 'g', 'a', 'b'], PCS = [0, 2, 4, 5, 7, 9, 11];
const FR = ['Do', 'Ré', 'Mi', 'Fa', 'Sol', 'La', 'Si'];
const CHROMA = ['Do', 'Do♯', 'Ré', 'Mi♭', 'Mi', 'Fa', 'Fa♯', 'Sol', 'Sol♯', 'La', 'Si♭', 'Si'];
const KEYNAME = { 0: 'C', 1: 'G', 2: 'D', 3: 'A', 4: 'E', 5: 'B', 6: 'F#', '-1': 'F', '-2': 'Bb', '-3': 'Eb', '-4': 'Ab', '-5': 'Db', '-6': 'Gb' };
function keyAcc(n) { const a = [0, 0, 0, 0, 0, 0, 0], sh = [3, 0, 4, 1, 5, 2, 6]; if (n > 0) for (let i = 0; i < n; i++) a[sh[i]] = 1; else for (let i = 0; i < -n; i++) a[sh[6 - i]] = -1; return a; }
function majTonic(n) { return n >= 0 ? (4 * n) % 7 : (3 * -n) % 7; }
const MODE = { major: [0, 'majeur'], minor: [5, 'mineur'], dorian: [1, 'dorien'], mixo: [4, 'mixolydien'] };
const lt = dn => ((dn % 7) + 7) % 7;
function midiOf(dn, acc) { const o = Math.floor(dn / 7); return 12 * (o + 1) + PCS[dn - o * 7] + acc; }
function midiName(m) { return CHROMA[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1); }
const rnd = Math.random, pick = a => a[Math.floor(rnd() * a.length)], rint = (a, b) => a + Math.floor(rnd() * (b - a + 1));
function wpick(items, wf) { let tot = 0; const w = items.map(it => { const x = wf(it); tot += x; return x; }); let r = rnd() * tot; for (let i = 0; i < items.length; i++) { r -= w[i]; if (r <= 0) return items[i]; } return items[items.length - 1]; }

/* ---------- cellules rythmiques (12 ticks = une noire) ---------- */
const CELLS = [ // [temps, ticks (négatif = silence), niveau mini, poids par style, 't' = triolet]
  [1, [12], 1, { c: 10, m: 10, s: 6, l: 6, f: 4 }],
  [1, [-12], 1, { c: 2, m: 2, s: 2, l: 2, f: 3 }],
  [2, [24], 1, { c: 5, m: 5, s: 3, l: 3, f: 2 }],
  [4, [48], 1, { c: 1.5, m: 1.5, s: 1, l: 1, f: .5 }],
  [3, [36], 2, { c: 1.5, m: 1, s: .7, l: .7, f: .3 }],
  [1, [6, 6], 2, { c: 8, m: 7, s: 11, l: 8, f: 5 }],

function jzTempo() { return S.jz.tempo[jzTempoKey()] || (isEar() ? [80, 90, 100, 112, 126] : [72, 84, 96, 112, 132])[S.jz.level - 1]; }

  if (isEar()) return;
  const cur = jzCur();
  $('jItem').innerHTML = jzItems().map(i => `<option value="${i.id}">${i.name} · niv. ${i.L}</option>`).join('');
  $('jItem').value = cur.id;
}
function jzFillControls() {
  $('jKey').innerHTML = KFR.map((k, i) => `<option value="${i}">${k}</option>`).join('');
  const j = S.jz;
  $('jType').value = j.type; $('jLevel').value = j.level; $('jOrder').value = j.order; $('jKey').value = j.key; $('jShow').value = j.show; $('jHelp').value = j.help; $('jSwing').checked = j.swing; $('jAuto').checked = j.auto;
  $('jType').onchange = e => { j.type = e.target.value; save(); jzSetup(); };
  $('jLevel').onchange = e => { j.level = +e.target.value; save(); jzSetup(); };
  $('jItem').onchange = e => { j.item[j.type] = e.target.value; save(); jzSetup(); };
  $('jOrder').onchange = e => { j.order = e.target.value; save(); jzSetup(); };
  $('jKey').onchange = e => { j.key = +e.target.value; save(); jzSetup(); };
  $('jShow').onchange = e => { j.show = +e.target.value; save(); jzSetup(); };
  $('jHelp').onchange = e => { j.help = +e.target.value; save(); jzSetup(); };
  $('jSwing').onchange = e => { j.swing = e.target.checked; save(); jzSetup(); };
  $('jAuto').onchange = e => { j.auto = e.target.checked; save(); };
  $('jTempo').oninput = e => { j.tempo[jzTempoKey()] = +e.target.value; $('jTempoVal').textContent = e.target.value; save(); };
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => showTab(b.dataset.t));
}
function showTab(t) {
  jzStop(); if (RUN.on) stopRun();
  S.tab = t; save();
  const jz = t === 'jazz';
  $('tabs').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  $('pSight').classList.toggle('hidden', jz); $('tSight').classList.toggle('hidden', jz);
  $('pJazz').classList.toggle('hidden', !jz); $('tJazz').classList.toggle('hidden', !jz);
  $('journalCard').classList.toggle('hidden', jz); $('result').classList.add('hidden');
  if (jz) jzSetup(); else newPiece();
}
function jzOrder() {
  const o = S.jz.order, st = +S.jz.key;
  if (o === 'single') return [st];
  if (o === 'rand') return shuffle([...Array(12).keys()]);
  return Array.from({ length: 12 }, (_, i) => (st + (o === '4ths' ? 5 : 1) * i) % 12);
}
function jzSetup() {
  jzStop();
  const ear = isEar();
  $('jItemF').classList.toggle('hidden', ear); $('jShowF').classList.toggle('hidden', ear); $('jHelpF').classList.toggle('hidden', !ear);
  $('jKeys').classList.toggle('hidden', ear);
  jzFillItems();
  const t = jzTempo(); $('jTempo').value = t; $('jTempoVal').textContent = t;
  JZ.keys = jzOrder(); JZ.idx = 0; JZ.fails = 0;
  $('result').classList.add('hidden');
  if (ear) jeNew(); else jzShow();
  jzSync();
}
function jzHidden() { return +S.jz.show === 2 || (+S.jz.show === 1 && JZ.idx > 0); }
function jzMemo(html) { const m = $('memo'); m.innerHTML = `<div>${html}</div>`; m.classList.remove('hidden'); }
function jzIdle() {
  const vp = $('vp'); vp.classList.remove('review'); vp.scrollLeft = 0;
  $('strip').classList.remove('flow'); placeStrip(staticPad());
  $('ph').classList.add('hidden'); $('mask').classList.add('hidden'); $('count').classList.add('hidden'); $('memo').classList.add('hidden');
}
function jzMastKey() { return S.jz.type + ':' + JZ.item.id; }
function jzChips() {
  const m = S.jz.mast[jzMastKey()] || {};
  $('jKeys').innerHTML = JZ.keys.map((pc, i) => `<span class="${i === JZ.idx ? 'cur ' : ''}${m[pc] == null ? '' : m[pc] >= 80 ? 'ok' : 'ko'}">${KFR[pc]}</span>`).join('');
}
function jzShow() {
  const it = jzCur(); JZ.item = it;
  const tr = transposeBars(itemBars(S.jz.type, it), JZ.keys[JZ.idx]);
  JZ.piece = mkPiece(tr.bars, S.jz.swing); JZ.tonic = tr.tonic;
  if (!render(JZ.piece, { fit: true })) return;
  jzIdle();
  if (jzHidden()) jzMemo(`<div class="big">En ${JZ.tonic}</div><div class="sub">${+S.jz.show === 2 ? 'Écoute, puis joue' : 'De mémoire'} — ${it.name}</div>`);
  const m = S.jz.mast[jzMastKey()] || {}, done = Object.values(m).filter(v => v >= 80).length;
  $('info').innerHTML = `<span class="tag">${it.name}</span><span class="tag plain">en ${JZ.tonic}</span><span class="tag plain">${JZ.idx + 1} / ${JZ.keys.length}</span>${S.jz.swing ? '<span class="tag plain">swing</span>' : ''}<span class="tag plain">${done} / 12 tonalités validées</span>`;
  jzChips();
  setStatus(CAN_MIC && +S.mic === 1 ? 'Prêt.' : 'Prêt (sans vérification au micro).');
}
function jzSync() {
  const run = (RUN.on && RUN.o.jazz) || JZ.pending, ear = isEar();
  if (ear) {
    const busy = run || JE.phase === 'listening';
    $('jStart').textContent = busy ? '■ Stop' : '▶︎ Écouter la phrase'; $('jStart').classList.toggle('stop', busy);
    $('jHear').textContent = 'Voir la solution'; $('jHear').disabled = false; $('jNext').textContent = 'Phrase suivante →';
  } else {
    const hear = RUN.on && RUN.o.jazz && RUN.kind === 'hear' && !JZ.chain;
    $('jStart').textContent = run && !hear ? '■ Stop' : '▶︎ Départ'; $('jStart').classList.toggle('stop', run && !hear);
    $('jHear').textContent = hear ? '■ Stop' : '🔊 Écouter'; $('jNext').textContent = 'Tonalité suivante →';
  }
}
function jzStop(msg) {
  clearTimeout(JZ.to); JZ.chain = false; JZ.pending = false;
  if (JE.phase === 'listening') { cancelAnimationFrame(JE.raf); }
  if (JE.phase !== 'done') JE.phase = 'idle';
  if (RUN.on && RUN.o.jazz) stopRun();
  KEEP_MIC = false; closeMic();
  jzSync(); if (msg) setStatus(msg);
}
function jzRun(kind) {
  const hide = kind === 'play' && jzHidden();
  if (hide) jzMemo(`<div class="big">En ${JZ.tonic}</div><div class="sub">${JZ.item.name}</div>`);
  startRun(kind, { piece: JZ.piece, jazz: true, static: true, hide, bpm: jzTempo(), label: `${kind === 'hear' ? 'Écoute' : 'À toi'} · en <b>${JZ.tonic}</b>`, onDone: jzDone });
}
$('jStart').onclick = () => {
  if (isEar()) { if ((RUN.on && RUN.o.jazz) || JE.phase === 'listening' || JZ.pending) { jzStop('Arrêté.'); return; } jePlay(); return; }
  if (RUN.on || JZ.pending) { jzStop('Arrêté.'); jzShow(); return; }
  clearTimeout(JZ.to); JZ.chain = true; JZ.fails = 0; KEEP_MIC = !!S.jz.auto;
  jzRun(+S.jz.show === 2 ? 'hear' : 'play');
};
$('jHear').onclick = () => {
  if (isEar()) { jeReveal(false); return; }
  if (RUN.on) { jzStop('Arrêté.'); jzShow(); return; }
  clearTimeout(JZ.to); JZ.chain = false; jzRun('hear');
};
$('jNext').onclick = () => {
  jzStop();
  JZ.idx = (JZ.idx + 1) % JZ.keys.length;
  if (isEar()) { jeNew(); jePlay(); } else { JZ.fails = 0; jzShow(); }
};
function jzDone(r) {
  $('ph').classList.add('hidden');
  if (r.kind === 'hear') {
    if (JZ.chain && +S.jz.show === 2) { jzLater(() => jzRun('play'), 250); return; }
    setStatus('À toi quand tu veux.'); return;
  }
  $('memo').classList.add('hidden');   // on montre la partition corrigée
  let msg = `En ${JZ.tonic} : terminé.`, pass = true;
  if (r.useMic) {
    const k = jzMastKey(), pc = JZ.keys[JZ.idx]; S.jz.mast[k] = S.jz.mast[k] || {};
    S.jz.mast[k][pc] = Math.max(S.jz.mast[k][pc] || 0, r.pct); save(); jzChips();
    pass = r.pct >= 80; msg = `En ${JZ.tonic} : <b>${r.pct} %</b>`;
  }
  const last = JZ.idx >= JZ.keys.length - 1;
  if (JZ.chain && S.jz.auto) {
    if (pass && !last) { setStatus(msg + ' · tonalité suivante…'); jzLater(() => { JZ.idx++; JZ.fails = 0; jzShow(); jzRun(+S.jz.show === 2 ? 'hear' : 'play'); }, 1700); return; }
    if (!pass && ++JZ.fails < 3) { setStatus(msg + ' · on la refait…'); jzLater(() => { if (jzHidden()) jzMemo(`<div class="big">En ${JZ.tonic}</div><div class="sub">${JZ.item.name}</div>`); jzRun(+S.jz.show === 2 ? 'hear' : 'play'); }, 2200); return; }
    msg += pass ? ' · série terminée 🎉' : ' · trois essais : baisse le tempo, ou passe à la suivante.';
  }
  jzStop(msg);
}

/* ---------- écoute et joue ---------- */
const EAR_LV = [null,
  { sc: ['pmin', 'pmaj'], len: [3, 4], leap: 1, chrom: 0 },
  { sc: ['pmin', 'maj', 'dor', 'mixo'], len: [4, 5], leap: 1, chrom: 0 },
  { sc: ['dor', 'mixo', 'maj', 'blues'], len: [5, 6], leap: 2, chrom: 0 },
  { sc: ['dor', 'mixo', 'blues', 'lyd', 'mmel'], len: [6, 7], leap: 2, chrom: .2 },
  { sc: ['bdom', 'alt', 'dimhw', 'mmel', 'lydb7', 'dor'], len: [7, 9], leap: 3, chrom: .25 }];
function genEarPhrase(L) {
  const lv = EAR_LV[L], sid = pick(lv.sc), sc = JZ_ITEMS.scale.find(s => s.id === sid), base = scaleNotes(sc.str);
  const pool = base.concat(base.map(n => ({ dn: n.dn + 7, acc: n.acc })), [{ dn: base[0].dn + 14, acc: base[0].acc }]);
  const M = n => midiOf(n.dn, n.acc), n = rint(lv.len[0], lv.len[1]);
  let i = pick([0, 2, Math.min(4, base.length - 1), base.length]), dir = pick([1, -1]), guard = 0;
  const seq = [pool[i]];
  while (seq.length < n && guard++ < 200) {
    if (rnd() < .3) dir = -dir;
    const st = rnd() < .7 ? 1 : rint(2, lv.leap + 1);
    let j = i + dir * st;
    if (j < 0 || j >= pool.length) { dir = -dir; j = i + dir * st; }
    if (j < 0 || j >= pool.length || M(pool[j]) === M(seq[seq.length - 1])) continue;
    if (lv.chrom && rnd() < lv.chrom && seq.length < n - 1) {
      const t = pool[j], a = { dn: t.dn - 1, acc: M(t) - 1 - midiOf(t.dn - 1, 0) };
      if (Math.abs(a.acc) <= 1 && M(a) !== M(seq[seq.length - 1])) seq.push(a);
    }
    seq.push(pool[j]); i = j;
  }
  return { seq, sc };
}
function jeSlots() { const el = document.getElementById('jeSlots'); if (el) el.innerHTML = JE.midis.map((m, i) => `<i class="${i < JE.pos ? 'ok' : ''}"></i>`).join(''); }
function jeNew() {
  const ph = genEarPhrase(S.jz.level), tr = transposeBars(packEighths(ph.seq, ph.sc.ch), JZ.keys[JZ.idx % JZ.keys.length]);
  JE.piece = mkPiece(tr.bars, S.jz.swing);
  if (!render(JE.piece, { fit: true })) return;
  jzIdle();
  const first = JE.piece.flat.find(e => !e.rest), fm = midiOf(first.dn, first.acc);
  JE.midis = buildTimeline(JE.piece, 100).notes.map(n => n.midi);
  Object.assign(JE, { phase: 'idle', pos: 0, tries: 0, name: `${tr.tonic} ${ph.sc.name.toLowerCase()}` });
  const firstTxt = FR[lt(first.dn)] + (first.acc === 1 ? '♯' : first.acc === -1 ? '♭' : '') + (fm < 60 ? ' grave' : fm >= 72 ? ' aigu' : ' médium');
  jzMemo(`<div class="big">${JE.name}</div><div class="sub">${JE.midis.length} notes${+S.jz.help === 1 ? ' · première note : ' + firstTxt : ''}</div><div class="slots" id="jeSlots"></div>`);
  jeSlots();
  $('info').innerHTML = `<span class="tag">Écoute et joue · niveau ${S.jz.level}</span><span class="tag plain">${S.jz.ear[S.jz.level] || 0} phrase${(S.jz.ear[S.jz.level] || 0) > 1 ? 's' : ''} trouvée${(S.jz.ear[S.jz.level] || 0) > 1 ? 's' : ''} du premier coup à ce niveau</span>`;
  setStatus('Écoute la phrase, puis rejoue-la.');
}
function jePlay() {
  if (RUN.on) return;
  cancelAnimationFrame(JE.raf); clearTimeout(JZ.to); JZ.pending = false;
  if (JE.phase === 'done') { jeNew(); }
  JE.phase = 'playing'; JE.pos = 0; jeSlots(); KEEP_MIC = true;
  startRun('hear', { piece: JE.piece, jazz: true, static: true, hide: true, bpm: jzTempo(), label: 'Écoute… 👂', onDone: jeListen });
}
async function jeListen() {
  $('memo').classList.remove('hidden'); $('ph').classList.add('hidden');
  if (!(CAN_MIC && +S.mic === 1)) { JE.phase = 'idle'; KEEP_MIC = false; jzSync(); setStatus('À toi ! Puis « Voir la solution » pour vérifier.'); return; }
  try { await openMic(); } catch (e) { JE.phase = 'idle'; jzSync(); setStatus('Micro refusé. Joue, puis « Voir la solution ».'); return; }
  Object.assign(JE, { phase: 'listening', pos: 0, cand: null, cnt: 0, sil: 0, wait: false, last: null });
  jeSlots(); jzSync(); setStatus('À toi 🎺 <span class="meter"><i class="lvl"></i></span>');
  JE.raf = requestAnimationFrame(jeLoop);
}
function jeLoop() {
  if (JE.phase !== 'listening' || !mic) return;
  const r = yin(readMic(), actx.sampleRate);
  document.querySelectorAll('.lvl').forEach(lv => lv.style.transform = `scaleX(${Math.min(1, r.rms * 8).toFixed(2)})`);
  const w = r.f && r.rms > 0.012 ? Math.round(69 + 12 * Math.log2(r.f / 440)) + transp() : null;
  if (w == null) { if (++JE.sil > 24) JE.wait = false; JE.cand = null; JE.cnt = 0; }
  else {
    JE.sil = 0;
    if (w === JE.cand) JE.cnt++; else { JE.cand = w; JE.cnt = 1; }
    if (!JE.wait) {
      const exp = JE.midis[JE.pos];
      if (JE.cnt === 3 && w === exp) { JE.pos++; JE.last = w; jeSlots(); if (JE.pos >= JE.midis.length) { jeWin(); return; } }
      else if (JE.cnt === 8 && w !== exp && w !== JE.last && w >= 50 && w <= 90) {
        JE.tries++; JE.pos = 0; JE.last = null; JE.wait = true; jeSlots();
        setStatus('✗ Ce n\'est pas ça : reprends au début, ou réécoute. <span class="meter"><i class="lvl"></i></span>');
      }
    }
  }
  JE.raf = requestAnimationFrame(jeLoop);
}
function jeReveal(won) {
  if (!JE.piece) return;
  clearTimeout(JZ.to); JZ.pending = false; cancelAnimationFrame(JE.raf);
  if (RUN.on && RUN.o.jazz) stopRun();
  JE.phase = 'done'; KEEP_MIC = false; closeMic();
  $('memo').classList.add('hidden'); $('ph').classList.add('hidden');
  JE.piece.flat.forEach(e => { if (!e.rest) color(e, won ? '#1E8E50' : '#1E1912'); });
  jzSync();
  if (!won) setStatus(`La solution : ${JE.name}.`);
}
function jeWin() {
  const tries = JE.tries;
  if (tries === 0) { S.jz.ear[S.jz.level] = (S.jz.ear[S.jz.level] || 0) + 1; save(); }
  const auto = !!S.jz.auto;
  jeReveal(true);
  setStatus(tries === 0 ? 'Trouvé du premier coup 🎯' : `Trouvé après ${tries} reprise${tries > 1 ? 's' : ''} 👏`);
  if (auto) jzLater(() => { JZ.idx = (JZ.idx + 1) % JZ.keys.length; jeNew(); jePlay(); }, 2600);
}

fillControls(); jzFillControls(); renderJournal();
if (VFlib()) showTab(S.tab); else $('loadErr').classList.remove('hidden');
</script>
